version: '3.8'
  
services:
  mysql:
    image: mysql:8.0
    container_name: fpt_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fpt_market
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  phpmyadmin:          
    image: adminer
    container_name: fpt_adminer
    ports:
      - "8081:8080"
    depends_on:
      - mysql

  backend:
    build:
      context: ./server
    container_name: fpt_backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
